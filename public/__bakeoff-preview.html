<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session confirmed · SAARTHI</title>
<meta name="color-scheme" content="light dark">
<style>
/* ============================================================
   SAARTHI — Session Confirmed card
   Palette: warm paper + deep petrol (trust) + muted moss (done).
   Type: system sans everywhere; system serif reserved for the
   person (monogram + clinician name) so warmth reads as intent.
   Hierarchy: the temporal band is the only full-bleed element
   AND carries the largest type — "when" wins by two channels.
   All text pairs verified >= WCAG AA in both themes.
   ============================================================ */

:root{
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;

  --page: #E8E2D8;
  --page-grad: radial-gradient(125% 85% at 50% 0%, #F3EFE8 0%, #E8E2D8 55%, #E1DACE 100%);

  --card: #FCFAF7;
  --card-line: #E4DDD2;
  --card-shadow:
    0 1px 1px rgba(22,38,42,.05),
    0 2px 4px -1px rgba(22,38,42,.05),
    0 18px 34px -18px rgba(22,38,42,.20);
  --card-top-gloss: inset 0 1px 0 rgba(255,255,255,.85);

  --ink:   #16262A;   /* headings, hero time            */
  --ink-2: #2C3D41;   /* body / values                  */
  --muted: #58696C;   /* labels, footnote, quiet actions */

  --rule: #E7E1D7;
  --rule-strong: #D5CEC2;
  --hover: #F1EDE6;
  --mono-bg: #E6EEE5;

  --band: #EBF1F0;
  --band-line: #DCE5E3;
  --band-rule: #0F5561;

  --brand: #0F5561;
  --brand-hover: #0B4550;
  --brand-ink: #FFFFFF;
  --brand-shadow: 0 1px 1px rgba(15,85,97,.20), 0 3px 8px -3px rgba(15,85,97,.32);

  --moss: #2E5A3E;
  --moss-soft: #E6EEE5;
  --danger: #8A3B32;
  --focus: #0F5561;
}

@media (prefers-color-scheme: dark){
  :root{
    /* Not an inversion: surfaces get a deeper, cooler ink-teal and
       separation comes from hairlines, not shadow. The primary
       action flips to a light fill on dark ink — mirroring the
       light theme's dark fill on light ink. */
    --page: #080D0F;
    --page-grad: radial-gradient(125% 85% at 50% 0%, #0E1618 0%, #080D0F 58%, #05090A 100%);

    --card: #162124;
    --card-line: rgba(234,239,237,.11);
    --card-shadow: 0 1px 0 rgba(0,0,0,.5), 0 22px 44px -26px rgba(0,0,0,.85);
    --card-top-gloss: inset 0 1px 0 rgba(234,239,237,.06);

    --ink:   #EAEFED;
    --ink-2: #CBD6D4;
    --muted: #93A3A3;

    --rule: rgba(234,239,237,.09);
    --rule-strong: rgba(234,239,237,.20);
    --hover: rgba(234,239,237,.06);
    --mono-bg: rgba(234,239,237,.07);

    --band: #1E2A2D;
    --band-line: rgba(234,239,237,.09);
    --band-rule: #5AA5AD;

    --brand: #5AA5AD;
    --brand-hover: #6BB6BD;
    --brand-ink: #051D21;
    --brand-shadow: none;

    --moss: #8CC79F;
    --moss-soft: rgba(140,199,159,.13);
    --danger: #E9A79C;
    --focus: #6BB6BD;
  }
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  min-height:100vh;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding: clamp(16px,6vw,48px) 12px;
  background: var(--page);
  background-image: var(--page-grad);
  font-family: var(--sans);
  color: var(--ink-2);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.vh{
  position:absolute; width:1px; height:1px;
  margin:-1px; padding:0; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%);
  white-space:nowrap; border:0;
}

/* ---------- card shell ---------- */
.card{
  --pad: clamp(18px, 5.5vw, 26px);
  width:100%;
  max-width:420px;
  background: var(--card);
  border:1px solid var(--card-line);
  border-radius:20px;
  box-shadow: var(--card-shadow), var(--card-top-gloss);
  overflow:hidden; /* clips the full-bleed band to the radius */
}

/* ---------- header: status + person ---------- */
.head{ padding: 20px var(--pad) 19px; }

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin:0 0 15px;
  padding:5px 11px 5px 9px;
  border-radius:999px;
  background: var(--moss-soft);
  color: var(--moss);
  font-size:.78rem;
  font-weight:600;
  letter-spacing:.005em;
  line-height:1.2;
}
.status svg{ flex:none; }

.clinician{ display:flex; align-items:center; gap:12px; }
.mono{
  flex:none;
  width:44px; height:44px;
  display:grid; place-items:center;
  border-radius:999px;
  background: var(--mono-bg);
  box-shadow: inset 0 0 0 1px var(--rule-strong);
  font-family: var(--serif);
  font-size:1rem;
  letter-spacing:.03em;
  color: var(--ink);
}
.name{
  margin:0;
  font-family: var(--serif);
  font-size: clamp(1.2rem, 4.6vw, 1.3125rem);
  font-weight:600;
  line-height:1.2;
  letter-spacing:.002em;
  color: var(--ink);
}
.role{
  margin:3px 0 0;
  font-size:.8125rem;
  line-height:1.3;
  color: var(--muted);
}

/* ---------- facts ---------- */
.facts{ margin:0; }

/* the hero: full-bleed, recessed, largest type on the card */
.when{
  background: var(--band);
  border-block:1px solid var(--band-line);
  border-left:3px solid var(--band-rule);
  padding: 15px var(--pad) 17px calc(var(--pad) - 3px);
}
.when-date{
  margin:0;
  font-size: clamp(.9rem, 3.5vw, 1rem);
  font-weight:600;
  line-height:1.35;
  letter-spacing:.004em;
  color: var(--ink-2);
}
.when-time{
  margin:3px 0 0;
  font-size: clamp(1.55rem, 7vw, 1.95rem);
  font-weight:600;
  line-height:1.15;
  letter-spacing:-.018em;
  color: var(--ink);
  font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
}
.when-time time{ font-variant-numeric: inherit; }
.zone{
  display:inline-block;
  margin-left:.18em;
  font-size:.58em;
  font-weight:600;
  letter-spacing:.045em;
  color: var(--muted);
  vertical-align:.09em;
  white-space:nowrap;
}

.row{
  display:grid;
  grid-template-columns: auto minmax(0,1fr);
  gap:14px;
  align-items:baseline;
  padding:11px var(--pad);
  border-bottom:1px solid var(--rule);
}
.row dt{
  font-size:.65rem;
  font-weight:600;
  letter-spacing:.075em;
  text-transform:uppercase;
  color: var(--muted);
  white-space:nowrap;
}
.row dd{
  margin:0;
  text-align:right;
  font-size:.875rem;
  font-weight:500;
  line-height:1.45;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.paid{ font-weight:600; color: var(--moss); }

/* ---------- actions ---------- */
.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:17px var(--pad) 0;
}
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  width:100%;
  min-height:48px;
  padding:13px 16px;
  border:1px solid transparent;
  border-radius:13px;
  font-family: var(--sans);
  font-size:.9375rem;
  font-weight:600;
  line-height:1.1;
  letter-spacing:-.004em;
  text-decoration:none;
  cursor:pointer;
  transition: background-color .16s ease, border-color .16s ease, color .16s ease, transform .1s ease;
}
.btn svg{ flex:none; opacity:.9; }
.btn--primary{
  background: var(--brand);
  color: var(--brand-ink);
  box-shadow: var(--brand-shadow);
}
.btn--primary:hover{ background: var(--brand-hover); }
.btn--ghost{
  background: transparent;
  color: var(--ink-2);
  border-color: var(--rule-strong);
}
.btn--ghost:hover{ background: var(--hover); }
.btn:active{ transform: translateY(1px); }

/* ---------- foot: recessive actions + policy ---------- */
.foot{
  margin-top:17px;
  padding:13px var(--pad) 19px;
  border-top:1px solid var(--rule);
}
.quiet{ display:flex; align-items:center; gap:9px; }
.quiet button{
  background:none;
  border:0;
  padding:11px 9px;
  margin:-11px -2px;
  border-radius:8px;
  font-family: var(--sans);
  font-size:.8125rem;
  font-weight:500;
  line-height:1.1;
  color: var(--muted);
  cursor:pointer;
  transition: color .16s ease;
}
.quiet button:hover{
  color: var(--ink-2);
  text-decoration:underline;
  text-underline-offset:3px;
  text-decoration-thickness:1px;
}
.quiet .cancel:hover{ color: var(--danger); }
.sep{
  width:1px; height:13px;
  background: var(--rule-strong);
  flex:none;
}
.note{
  margin:11px 0 0;
  max-width:34ch;
  font-size:.78rem;
  line-height:1.5;
  color: var(--muted);
  text-wrap: pretty;
}

/* ---------- focus ---------- */
:where(a,button):focus-visible{
  outline:2px solid var(--focus);
  outline-offset:3px;
}
.quiet button:focus-visible{ outline-offset:1px; }

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
  .btn:active{ transform:none; }
}

@media print{
  body{ background:#fff; padding:0; }
  .card{
    max-width:none; border-color:#c9c9c9; box-shadow:none;
    --card:#fff; --band:#f4f4f2; --ink:#111; --ink-2:#222; --muted:#4a4a4a;
    --moss:#2E5A3E; --moss-soft:#eef3ec; --band-rule:#0F5561;
    --rule:#e2e2e2; --rule-strong:#cccccc; --mono-bg:#f0f0ee;
  }
  .actions, .quiet{ display:none; }
  .foot{ border-top:1px solid #e2e2e2; }
}
</style>
</head>
<body>

<main>
  <article class="card" aria-labelledby="confirm-title">

    <header class="head">
      <h1 class="status" id="confirm-title">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
          <circle cx="10" cy="10" r="8.3" stroke="currentColor" stroke-width="1.5" opacity=".42"/>
          <path d="M6.3 10.4l2.55 2.5L13.7 7.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Session confirmed
      </h1>

      <div class="clinician">
        <span class="mono" aria-hidden="true">AR</span>
        <div>
          <h2 class="name">Dr. Ananya Rao</h2>
          <p class="role">Clinical Psychologist</p>
        </div>
      </div>
    </header>

    <dl class="facts">

      <div class="when">
        <dt class="vh">Date</dt>
        <dd class="when-date">
          <time datetime="2026-09-11">Thursday, 11 September 2026</time>
        </dd>

        <dt class="vh">Time</dt>
        <dd class="when-time">
          <time datetime="2026-09-11T18:30+05:30">6:30</time><span aria-hidden="true"> – </span><span class="vh"> to </span><time datetime="2026-09-11T19:20+05:30">7:20</time><span class="zone"> PM IST</span>
        </dd>
      </div>

      <div class="row">
        <dt>Duration</dt>
        <dd>50 minutes</dd>
      </div>

      <div class="row">
        <dt>Format</dt>
        <dd>Video session<span aria-hidden="true"> · </span><span class="vh">, </span>Google Meet</dd>
      </div>

      <div class="row">
        <dt>Payment</dt>
        <dd>₹1,800<span aria-hidden="true"> · </span><span class="vh">, </span><span class="paid">Paid</span></dd>
      </div>

    </dl>

    <div class="actions">
      <a class="btn btn--primary" href="https://meet.google.com/qzy-mkbd-hrs" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 22 22" fill="none" aria-hidden="true" focusable="false">
          <rect x="2.3" y="5.8" width="11.9" height="10.4" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M14.2 9.9 18.1 7.4a.85.85 0 0 1 1.3.72v5.76a.85.85 0 0 1-1.3.72L14.2 12.1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        Join Google Meet
      </a>

      <button class="btn btn--ghost" type="button">
        <svg width="17" height="17" viewBox="0 0 22 22" fill="none" aria-hidden="true" focusable="false">
          <rect x="3.3" y="4.8" width="15.4" height="13.9" rx="2.7" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3.5 9.3h15" stroke="currentColor" stroke-width="1.6"/>
          <path d="M7.5 2.8v3M14.5 2.8v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M11 11.9v4.2M8.9 14h4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Add to calendar
      </button>
    </div>

    <footer class="foot">
      <div class="quiet">
        <button type="button">Reschedule</button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" class="cancel">Cancel</button>
      </div>
      <p class="note">Free reschedule up to 24 hours before your session.</p>
    </footer>

  </article>
</main>

</body>
</html>
